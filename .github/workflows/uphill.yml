name: Uphill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  uphill:
    name: Uphill metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: ./.github/actions/zig

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Uphill
        uses: wevm/uphill@main
