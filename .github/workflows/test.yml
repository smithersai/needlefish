# `just ci` (tidy, zig build test, zig build check) as parallel jobs. The logic lives in etc/:
# etc/ci/baseline.sh finds the last green commit, etc/scripts/ci-shards.py plans the steps the
# push's diff from it affects and deals them to shards by etc/ci/costs.tsv, etc/ci/shard.sh
# runs a shard. Keep this file thin (AGENTS.md rule 9). A plan that fits one shard runs in the
# plan job itself; tidy runs beside it. The run's conclusion is the status (etc/ci/README.md).
name: test

on:
  push:
    branches: [main, "ci-shards/**"]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # etc/ci/baseline.sh finds the last green run
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        # Against the last commit whose run passed on this branch (etc/ci/baseline.sh says why);
        # with none, every step.
        run: |
          base=$(bash etc/ci/baseline.sh "$GITHUB_REPOSITORY" "$BRANCH" test.yml)
          python3 -I etc/scripts/ci-shards.py plan "$base" HEAD 12 >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.count == '1'
        uses: ./.github/actions/zig
      - name: build runner
        if: steps.plan.outputs.count == '1'
        run: zig build -l -Drequire-io-uring=true >/dev/null
      - name: steps
        if: steps.plan.outputs.count == '1'
        env:
          STEPS: ${{ fromJSON(steps.plan.outputs.matrix).include[0].steps }}
        run: |
          # shellcheck disable=SC2086 # one step name per word
          bash etc/ci/shard.sh $STEPS

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore zig
        id: zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('etc/scripts/install-zig.sh') }}
      - name: install zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: sh etc/scripts/install-zig.sh "$HOME/zig"
      - name: tidy
        run: PATH="$HOME/zig:$PATH" bash etc/scripts/tidy.sh

  shard:
    name: shard ${{ matrix.shard }}
    needs: plan
    if: fromJSON(needs.plan.outputs.count) > 1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
      - name: build runner
        run: zig build -l -Drequire-io-uring=true >/dev/null
      - name: steps
        env:
          STEPS: ${{ matrix.steps }}
        run: |
          # shellcheck disable=SC2086 # one step name per word
          bash etc/ci/shard.sh $STEPS
